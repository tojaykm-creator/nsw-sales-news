name: collect-news
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect-news
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update news" && git push)
