<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSW Sales News</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#fff;--fg:#111827;--mut:#6b7280;--card:#f3f4f6;--ac:#1d4ed8;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--fg:#e5e7eb;--mut:#9ca3af;--card:#1b2232;--ac:#7aa2ff;--line:#2a3347}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line);transition:transform .2s;z-index:2}
header.hide{transform:translateY(-100%)}main{max-width:640px;margin:0 auto;padding:12px 16px 90px}
h1{margin:0;font-size:20px}small,.mut{color:var(--mut);font-size:12px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin-top:8px}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px}
button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.grid button{font-size:11px;padding:6px 2px}
article{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}article a{color:var(--fg);font-weight:600;text-decoration:none}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin:0 4px 4px 0}
.tip{color:var(--ac);font-size:13px;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:6px}
nav button{flex:1;border:0}
</style></head><body>
<header><h1>NSW Sales News</h1><small id="upd"></small></header><main id="m"></main><nav id="nav"></nav>
<script>
const CFG=__CFG__,SEED=__SEED__;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("lang","en"),saved=store.get("saved",{}),items=SEED,sample=true,updated="",tab="today",cat="",stage="",q="",shown=60,stFilter="";
const L=(en,ko)=>lang==="ko"?ko:en;
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//.test(u)?u:"#";
const day=d=>new Date(d).toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric",timeZone:"Australia/Sydney"});
const catOf=id=>CFG.cats.find(c=>c[0]===id)||CFG.cats[6];
const stName=s=>{const x=CFG.stages.find(v=>v[0]===s);return x?L(x[0],x[1]):""};
const STAT=[["check","To check","확인 필요"],["doing","In progress","진행 중"],["done","Done","완료"]];
function card(i,n){const s=saved[i.url],c=catOf(i.cat);
return `<article><div class="mut">${n?n+". ":""}${esc(L(c[1],c[2]))} · ${esc(i.source)} · ${day(i.date)}</div>
<a href="${esc(safe(i.url))}" target="_blank" rel="noopener">${esc(L(i.title,i.ko||i.title))}</a><div>${[stName(i.stage),i.amount,i.region].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
<div class="tip">${esc(L(c[5],c[6]))}</div><button data-save="${esc(i.url)}" class="${s?"on":""}">${s?L("Saved","저장됨"):L("Save","저장")}</button></article>`}
const sorted=()=>[...items].sort((a,b)=>b.date.localeCompare(a.date));
const match=i=>(!cat||i.cat===cat)&&(!q||[i.title,i.ko,i.region,i.source].join(" ").toLowerCase().includes(q.toLowerCase()));
function list(){const all=sorted().filter(match);return all.slice(0,shown).map(i=>card(i)).join("")||`<p class="mut">${L("No news found.","해당 뉴스가 없습니다.")}</p>`}
function render(){
 document.getElementById("upd").textContent=sample?L("Sample: articles found 26 Nov 2026. Not live.","샘플: 2026-11-26 검색 기사. 자동 수집 아님."):L("Updated ","갱신 ")+new Date(updated).toLocaleString("en-AU",{timeZone:"Australia/Sydney"});
 let h="";
 if(tab==="today"){
  const rank=i=>(i.stage?2:0)+(i.amount?1:0)+(i.region?1:0);
  const week=sorted().filter(i=>Date.now()-new Date(i.date)<14*864e5);
  const top=(week.length>=3?week:sorted()).slice().sort((a,b)=>rank(b)-rank(a)||b.date.localeCompare(a.date)).slice(0,3);
  h=`<input id="q" placeholder="${L("Search company, region, topic","회사, 지역, 주제 검색")}" value="${esc(q)}">
  <div class="grid">${[["",L("All","전체")],...CFG.cats.map(c=>[c[0],L(c[1],c[2])])].map(c=>`<button data-cat="${c[0]}" class="${cat===c[0]?"on":""}">${esc(c[1])}</button>`).join("")}</div>
  ${!cat&&!q?`<h3>${L("Top 3 sales signals","핵심 영업 신호 3건")}</h3>${top.map((i,n)=>card(i,n+1)).join("")}<h3>${L("Latest","최신")}</h3>`:""}<div id="list">${list()}</div>`;
 }else if(tab==="leads"){
  const all=sorted().filter(i=>i.stage&&(!stage||i.stage===stage));
  h=`<div class="grid">${CFG.stages.map(s=>`<button data-stage="${s[0]}" class="${stage===s[0]?"on":""}">${esc(L(s[0],s[1]))} ${items.filter(i=>i.stage===s[0]).length}</button>`).join("")}</div>${all.map(i=>card(i)).join("")}`;
 }else if(tab==="saved"){
  const rows=Object.values(saved).filter(s=>!stFilter||s.status===stFilter);
  h=`<div class="grid">${[["","All","전체"],...STAT].map(s=>`<button data-st="${s[0]}" class="${stFilter===s[0]?"on":""}">${L(s[1],s[2])}</button>`).join("")}</div>
  <p class="mut">${L("Notes stay in this browser only.","메모는 이 브라우저에만 저장됩니다.")}</p>${rows.map(s=>card(s.item)+`<select data-status="${esc(s.item.url)}">${STAT.map(x=>`<option value="${x[0]}" ${s.status===x[0]?"selected":""}>${L(x[1],x[2])}</option>`).join("")}</select><textarea data-memo="${esc(s.item.url)}" placeholder="${L("Memo","메모")}">${esc(s.memo)}</textarea>`).join("")}
  <button id="csv">${L("Export CSV","엑셀용 CSV 내보내기")}</button> <textarea id="out" hidden rows="6"></textarea>`;
 }else{
  h=`<h3>${L("Language","언어")}</h3><button data-lang="en" class="${lang==="en"?"on":""}">English</button> <button data-lang="ko" class="${lang==="ko"?"on":""}">한국어</button>`;
 }
 document.getElementById("m").innerHTML=h;
 document.getElementById("nav").innerHTML=[["today","Today","오늘"],["leads","Leads","리드"],["saved","Saved","저장"],["set","Settings","설정"]].map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?"on":""}">${L(t[1],t[2])}</button>`).join("");
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.tab){tab=d.tab;scrollTo(0,0)}else if("cat" in d){cat=d.cat;shown=60}else if(d.stage){stage=stage===d.stage?"":d.stage}else if("st" in d){stFilter=d.st}
 else if(d.lang){lang=d.lang;store.set("lang",lang)}
 else if(d.save){if(saved[d.save])delete saved[d.save];else{const item=items.find(i=>i.url===d.save);if(item)saved[d.save]={item,status:"check",memo:""}}store.set("saved",saved)}
 else if(b.id==="csv"){const cell=v=>{v=String(v||"");if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const text=[["Date","Title","Source","Status","Memo","URL"],...Object.values(saved).map(s=>[s.item.date.slice(0,10),s.item.title,s.item.source,s.status,s.memo,s.item.url])].map(r=>r.map(cell).join(",")).join("\n");
  const o=document.getElementById("out");o.hidden=false;o.value=text;
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+text],{type:"text/csv"}));a.download="saved_leads.csv";a.click()}catch(x){}return}
 else return;
 render()});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
 if(t.id==="q"){q=t.value;shown=60;const p=t.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)}
 if(d.memo){saved[d.memo].memo=t.value;store.set("saved",saved)}
 if(d.status){saved[d.status].status=t.value;store.set("saved",saved)}});
let last=0;addEventListener("scroll",()=>{const y=scrollY;document.querySelector("header").classList.toggle("hide",y>last&&y>60);last=y;
 if(tab==="today"&&innerHeight+y>document.body.scrollHeight-200&&shown<items.length){shown+=60;document.getElementById("list").innerHTML=list()}});
render();
fetch("data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.items&&j.items.length){items=j.items;updated=j.updated;sample=false;render()}}).catch(()=>{});
</script></body></html>
